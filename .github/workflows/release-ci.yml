name: Release CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.25"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install system runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Sync CPU release environment
        run: >-
          uv sync --locked
          --extra cpu
          --extra data
          --extra models
          --extra training
          --group dev

      - name: Check lockfile
        run: uv lock --check

      - name: Run portable test suite
        run: uv run --no-sync pytest -m "not controlled_host"

      - name: Check source diff and compile Python
        run: |
          git diff --check
          uv run --no-sync python -m compileall -q \
            artifact_contracts canine_identity data_pipeline evaluation \
            evidence_fusion experiments foundation identity_governance \
            identity_methods identity_retrieval localization operations \
            representation_learning vis workflows

      - name: Build distributions
        run: uv build --out-dir dist

      - name: Inspect and import built wheel
        shell: bash
        run: |
          wheel_path=$(printf '%s\n' dist/*.whl)
          WHEEL_PATH="$wheel_path" uv run --no-sync python - <<'PY'
          import os
          import zipfile

          wheel_path = os.environ["WHEEL_PATH"]
          with zipfile.ZipFile(wheel_path) as wheel:
              names = set(wheel.namelist())
          assert any(name.endswith(".dist-info/licenses/LICENSE") for name in names)
          assert "artifact_contracts/schemas/cvi.evaluation.report.v3.schema.json" in names
          PY
          UV_PROJECT_ENVIRONMENT=.wheel-venv \
            uv sync --locked --extra cpu --no-dev
          uv pip uninstall \
            --python .wheel-venv/bin/python canine-video-identity
          uv pip install \
            --python .wheel-venv/bin/python --no-deps "$wheel_path"
          .wheel-venv/bin/python - <<'PY'
          from importlib import resources

          import canine_identity
          import torch

          schema = resources.files("artifact_contracts").joinpath(
              "schemas/cvi.evaluation.report.v3.schema.json"
          )
          assert schema.is_file()
          assert canine_identity.__all__ == ["IdentityEngine", "Match"]
          assert canine_identity.IdentityEngine.__module__ == "canine_identity.engine"
          assert torch.version.cuda is None
          PY
