name: Release CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.25"
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install system runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Sync CPU release environment
        run: >-
          uv sync --locked
          --extra cpu
          --extra data
          --extra models
          --extra training
          --group dev

      - name: Check lockfile
        run: uv lock --check

      - name: Run portable test suite
        run: |
          uv run --no-sync pytest tests/test_full128_training.py
          uv run --no-sync pytest -m "not controlled_host" \
            --ignore=tests/test_full128_training.py

      - name: Check source diff and compile Python
        run: |
          git diff --check
          uv run --no-sync python -m compileall -q \
            canine_identity contracts data evaluation \
            embedding experiments foundation identity \
            parsing retrieval systems visualization workflows

      - name: Build distributions
        run: uv build --out-dir dist

      - name: Inspect and import built wheel
        shell: bash
        run: |
          wheel_path=$(printf '%s\n' dist/*.whl)
          WHEEL_PATH="$wheel_path" uv run --no-sync python - <<'PY'
          import os
          import zipfile

          wheel_path = os.environ["WHEEL_PATH"]
          with zipfile.ZipFile(wheel_path) as wheel:
              names = set(wheel.namelist())
          assert any(name.endswith(".dist-info/licenses/LICENSE") for name in names)
          assert "contracts/schemas/cvi.evaluation.report.v3.schema.json" in names
          assert "contracts/intake/pretrained_weight_intake.py" in names
          assert "contracts/pdq.py" in names
          assert "contracts/pretrained_weight_intake.py" not in names
          assert not any(name.startswith("artifact_contracts/") for name in names)
          assert "data/__init__.py" in names
          assert "data/configs/crop_export_policy.example.json" in names
          assert "data/public/public_dataset.py" in names
          assert "data/full_segment/route_plan.py" in names
          assert "data/dataset.py" not in names
          assert "data/decode.py" not in names
          assert not any(name.startswith("data_pipeline/") for name in names)
          assert "retrieval/__init__.py" in names
          assert not any(name.startswith("identity_retrieval/") for name in names)
          assert "parsing/__init__.py" in names
          assert "parsing/landmark_graph.py" not in names
          assert "parsing/benchmark.py" not in names
          assert "parsing/fold_protocol.py" not in names
          assert not any(name.startswith("localization/") for name in names)
          assert "embedding/methods/__init__.py" in names
          assert "embedding/methods/landmark.py" in names
          assert "embedding/methods/full_segment/preparation/route_plan.py" not in names
          assert "embedding/methods/nose/data/embedding_views.py" in names
          assert "embedding/methods/nose/training/embedding_consistency_training.py" in names
          assert "embedding/learning/__init__.py" in names
          assert "embedding/evidence/__init__.py" in names
          assert not any(name.startswith("identity_methods/") for name in names)
          assert not any(name.startswith("representation_learning/") for name in names)
          assert not any(name.startswith("evidence_fusion/") for name in names)
          assert "identity/registry/identity_registry.py" in names
          assert "identity/splits/protected_public_split.py" in names
          assert "identity/splits/tracklet_split.py" in names
          assert "identity/splits/public_duplicate_adjudication.py" in names
          assert not any(name.startswith("identity_governance/") for name in names)
          assert "systems/inference/onnx_backend.py" in names
          assert "systems/workers/embedding_production_runner.py" in names
          assert "systems/measurement/capacity.py" in names
          assert "systems/measurement/decode.py" in names
          assert "systems/configs/onnx_cpu_backend.example.json" in names
          assert not any(name.startswith("operations/") for name in names)
          assert "visualization/__init__.py" in names
          assert not any(name.startswith("vis/") for name in names)
          assert "evaluation/localization.py" in names
          assert "evaluation/localization_kfold.py" in names
          PY
          UV_PROJECT_ENVIRONMENT=.wheel-venv \
            uv sync --locked --extra cpu --no-dev
          uv pip uninstall \
            --python .wheel-venv/bin/python canine-video-identity
          uv pip install \
            --python .wheel-venv/bin/python --no-deps "$wheel_path"
          .wheel-venv/bin/python -I - <<'PY'
          from importlib import resources, util

          import canine_identity
          import contracts.intake
          import data
          import embedding
          import identity
          import parsing
          import systems
          from embedding.methods.nose.data import embedding_views
          from identity.splits import tracklet_split
          from systems.measurement import capacity
          import torch

          schema = resources.files("contracts").joinpath(
              "schemas/cvi.evaluation.report.v3.schema.json"
          )
          assert schema.is_file()
          assert resources.files("data").joinpath(
              "configs/crop_export_policy.example.json"
          ).is_file()
          assert embedding_views.MANIFEST_SCHEMA == "cvi.nose_embedding_views.v1"
          assert tracklet_split.SplitManifest.__module__ == (
              "identity.splits.tracklet_split"
          )
          assert capacity.CapacityPlan.__module__ == "systems.measurement.capacity"
          assert util.find_spec("data_pipeline") is None
          assert util.find_spec("data.dataset") is None
          assert util.find_spec("data.decode") is None
          assert util.find_spec("parsing.landmark_graph") is None
          for old_package in (
              "evidence_fusion",
              "identity_governance",
              "identity_methods",
              "localization",
              "operations",
              "representation_learning",
          ):
              assert util.find_spec(old_package) is None
          assert canine_identity.__all__ == ["IdentityEngine", "Match"]
          assert canine_identity.IdentityEngine.__module__ == "canine_identity.engine"
          assert torch.version.cuda is None
          PY
